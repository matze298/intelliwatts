[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelliwatts"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "google-genai",
    "gunicorn",
    "jinja2",
    "openai",
    "markdown",
    "nh3>=0.3.7",
    "polars",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]>=3.2",
    "python-multipart",
    "requests",
    "requests-cache",
    "sqlmodel",
    "uvicorn",
    "alembic",
]

[project.optional-dependencies]
test = [
    "playwright>=1.64.0",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "requests-mock",
]
dev = ["black", "prek", "ruff", "ty"]

# Hatch configuration
[tool.hatch.build]
# Include the app/ directory directly (no src/ layout)
include = ["app/**"]

[tool.hatch.metadata]
allow-direct-references = true

# uv configuration (dependency locking handled via uv.lock)
[tool.uv]
managed = true

# Ruff configuration
[tool.ruff]
line-length = 120
target-version = "py314"
fix = true

# Google Python Style Guide alignment
preview = true

[tool.ruff.lint]
select = ["ALL"]
# Google-specific relaxations
ignore = [
    "missing-copyright-notice", # No copyright added yet
    "incorrect-blank-line-before-class",   # One blank line before class (Google prefers no extra line)
    "multi-line-summary-second-line",   # Multi-line docstring summary on first line
    "line-too-long",   # Line length handled by formatter guidance
    "line-contains-todo", # Allow ToDo comments
    "raise-within-try", # Allow to raise Exceptions within try blocks
    "missing-trailing-comma", # Recommended ignore from ruff-format
]


# Docstring conventions: Google style
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bandit]
# Only HTML returned from this allowlist sanitizer may be marked as trusted markup.
allowed-markup-calls = ["app.utils.markdown._sanitize_html"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "assert", # allow asserts in tests
    "private-member-access", # allow asserts in tests
    "float-equality-comparison", # allow magic number comparison in tests
    "magic-value-comparison" # allow magic number comparison in tests
    ] 

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
