<!-- app/templates/macros/widgets.html -->
{% macro render_widget(widget) %}
    {% if widget.custom_template %}
        {% include widget.custom_template %}
    {% else %}
        <div class="stat-card">
            <h2 class="stat-label">{{ widget.title }}</h2>
            <div class="space-y-2">
                <p class="stat-value">{{ widget.value }}</p>
                {% if widget.trend %}
                <p class="stat-trend {% if widget.trend_positive is sameas true %}is-positive{% elif widget.trend_positive is sameas false %}is-negative{% endif %}">
                    {{ widget.trend }}
                </p>
                {% endif %}
            </div>
        </div>
    {% endif %}
{% endmacro %}
