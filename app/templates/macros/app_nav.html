{% macro app_nav(active="planner") -%}
<nav class="app-nav" aria-label="Main navigation">
    <a class="app-brand" href="/dashboard" aria-label="IntelliWatts home">
        <span class="app-brand-art" aria-hidden="true"><img src="/static/intelliwatts-logo.webp" alt="" width="320" height="320"></span>
        <span class="app-brand-name">IntelliWatts</span>
    </a>
    {% if active != "login" %}
    <div class="app-nav-links">
        <a href="/dashboard" {% if active == "dashboard" %}aria-current="page"{% endif %}><svg class="nav-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9.5 21v-7h5v7"/></svg>Dashboard</a>
        <a href="/" {% if active == "planner" %}aria-current="page"{% endif %}><svg class="nav-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v4m10-4v4M3 9h18M4 5h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm5 8h2v2H9zm5 0h2v2h-2z"/></svg>Plan</a>
        <a href="/settings" {% if active == "settings" %}aria-current="page"{% endif %}><svg class="nav-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm0-6 1.5 2.2 2.6.7 2.5-.9 1.8 1.8-.9 2.5.7 2.6 2.2 1.5-2.2 1.5-.7 2.6.9 2.5-1.8 1.8-2.5-.9-2.6.7L12 22l-1.5-2.2-2.6-.7-2.5.9-1.8-1.8.9-2.5-.7-2.6L1.6 12l2.2-1.5.7-2.6-.9-2.5 1.8-1.8 2.5.9 2.6-.7z"/></svg>Settings</a>
    </div>
    <div class="theme-control">
        <span class="theme-control-label">Appearance</span>
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" onclick="IWTheme.toggle()">
            <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
            <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M20 15.1A8.5 8.5 0 0 1 8.9 4a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
            <span class="sr-only">Toggle color theme</span>
        </button>
    </div>
    <form method="post" action="/logout" class="nav-logout">
        <button class="control-button-secondary" type="submit">Sign out</button>
    </form>
    {% endif %}
</nav>
{%- endmacro %}
