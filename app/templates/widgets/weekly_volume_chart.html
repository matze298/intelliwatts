{% from "macros/controls.html" import render_toggle_button %}
<!-- app/templates/widgets/weekly_volume_chart.html -->
<div class="chart-card space-y-5">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-lg mt-0 mb-1">Weekly volume</h2>
            <p class="text-sm text-slate-600">Compare training time and training stress.</p>
        </div>
        <div class="control-toggle-group">
            {{ render_toggle_button("toggle-hours", "Hours", true, "updateVolumeChart('duration')") }}
            {{ render_toggle_button("toggle-tss", "TSS", false, "updateVolumeChart('tss')") }}
        </div>
    </div>

    <div class="chart-frame chart-frame-short">
        <canvas id="weeklyVolumeChart"></canvas>
    </div>
</div>

<script>
    (function() {
        if (typeof Chart === 'undefined') return;
        const data = {{ widget.data | tojson }};
        const ctx = document.getElementById('weeklyVolumeChart').getContext('2d');
        
        const sportColors = {
            'Ride': '#147969',
            'VirtualRide': '#76ae9a',
            'Run': '#d8755c',
            'VirtualRun': '#efa48e',
            'Swim': '#6e91a0',
            'Walk': '#c89b50',
            'WeightTraining': '#827a91',
            'Yoga': '#b7a48a',
            'Other': '#9aa9a1'
        };

        const uniqueColors = [
            '#c89b50', '#b65e4f', '#827a91', '#6e91a0',
            '#d8755c', '#9c7790', '#5d9b89', '#647c69'
        ];

        function getColor(sport, index) {
            return sportColors[sport] || uniqueColors[index % uniqueColors.length];
        }

        const labels = data.weeks.map(w => {
            const date = new Date(w);
            return `${date.getMonth() + 1}-${date.getDate()}`;
        });

        function createDatasets(metric) {
            const dataSource = metric === 'duration' ? data.duration_by_type : data.tss_by_type;
            return Object.keys(dataSource).map((sport, index) => ({
                label: sport,
                data: dataSource[sport],
                backgroundColor: getColor(sport, index),
                borderWidth: 0,
                borderRadius: 4,
                stack: 'stack0'
            }));
        }

        window.volumeChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: createDatasets('duration')
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        stacked: true,
                        grid: { display: false },
                        ticks: {
                            color: '#71817a',
                            font: { size: 10, weight: 'bold' }
                        }
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true,
                        grid: { color: 'rgba(53, 83, 70, 0.10)' },
                        ticks: {
                            color: '#71817a',
                            font: { size: 10, weight: 'bold' }
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        labels: {
                            boxWidth: 12,
                            padding: 15,
                            color: '#71817a',
                            font: { size: 10, weight: 'bold' }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,
                        cornerRadius: 8,
                        titleFont: { size: 12, weight: 'bold' },
                        bodyFont: { size: 12 },
                        callbacks: {
                            label: function(context) {
                                const val = context.raw;
                                const metric = window.currentVolumeMetric === 'tss' ? 'TSS' : 'h';
                                return ` ${context.dataset.label}: ${val}${metric}`;
                            }
                        }
                    }
                }
            }
        });

        window.currentVolumeMetric = 'duration';

        window.updateVolumeChart = function(metric) {
            window.currentVolumeMetric = metric;
            const btnHours = document.getElementById('toggle-hours');
            const btnTss = document.getElementById('toggle-tss');

            if (metric === 'duration') {
                btnHours.className = "control-button control-toggle control-toggle-active";
                btnTss.className = "control-button control-toggle";
            } else {
                btnTss.className = "control-button control-toggle control-toggle-active";
                btnHours.className = "control-button control-toggle";
            }

            window.volumeChart.data.datasets = createDatasets(metric);
            window.volumeChart.update();
        };
    })();
</script>
