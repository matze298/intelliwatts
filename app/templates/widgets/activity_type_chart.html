<section class="chart-card" aria-label="Sport distribution">
 <h3 class="text-lg mt-0 mb-1">Sport mix</h3><p class="text-sm text-slate-600">Training time by activity type</p>
 <div class="flex flex-col sm:flex-row items-center gap-6 mt-4">
  <div class="relative w-48 h-48 shrink-0"><canvas id="typeChart" aria-label="Sport mix doughnut chart"></canvas><div data-chart-total class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none"><span class="text-xs font-semibold uppercase text-slate-500">Total</span><span class="text-xl font-extrabold text-slate-900">{{ widget.data["total_hours"] | round(1) }}h</span></div></div>
  <ul class="w-full space-y-2" aria-label="Sport mix breakdown">{% for label in widget.data["labels"] %}<li class="flex justify-between gap-4 border-b border-slate-100 pb-2"><span class="text-sm font-medium">{{ label }}</span><span class="text-sm text-slate-600">{{ widget.data["values"][loop.index0] | round(1) }} h</span></li>{% else %}<li class="text-sm text-slate-600">No activity data for this period.</li>{% endfor %}</ul>
 </div>
</section>
<script>
(() => {const data={{ widget.data|tojson }};const canvas=document.getElementById('typeChart');if(!canvas||typeof Chart==='undefined')return;new Chart(canvas,{type:'doughnut',data:{labels:data.labels,datasets:[{data:data.values,backgroundColor:['#18786e','#d97761','#426c93','#dfb35e','#89bdb5','#8b7a9f','#d49a6e','#527d75'],borderColor:'#fff',borderWidth:3,hoverOffset:5}]},options:{responsive:true,maintainAspectRatio:false,cutout:'76%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw} h`}}}}});})();
</script>
