<div class="wellness-grid">
 <section class="chart-card" aria-label="Heart rate variability"><h3 class="text-lg mt-0 mb-1">Heart rate variability</h3><p class="text-sm text-slate-600">Milliseconds · daily and 7-day average</p><div class="chart-frame chart-frame-short mt-3"><canvas id="hrvChart" aria-label="Heart rate variability trend"></canvas></div></section>
 <section class="chart-card" aria-label="Resting heart rate"><h3 class="text-lg mt-0 mb-1">Resting heart rate</h3><p class="text-sm text-slate-600">Beats per minute · daily and 7-day average</p><div class="chart-frame chart-frame-short mt-3"><canvas id="restChart" aria-label="Resting heart rate trend"></canvas></div></section>
</div>
{% if widget.data.sleep_rating %}<section class="chart-card wellness-sleep" aria-label="Sleep rating"><h3 class="text-lg mt-0 mb-1">Sleep quality</h3><p class="text-sm text-slate-600">Daily score · 0–100</p><div class="chart-frame chart-frame-short mt-3"><canvas id="sleepRatingChart" aria-label="Sleep rating trend"></canvas></div></section>{% else %}<p class="wellness-sleep-empty">Sleep rating is not available for this period.</p>{% endif %}
<script>
(() => {
 const data = {{ widget.data | tojson }};
 const options = {responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{usePointStyle:true,boxWidth:7,color:'#405560',padding:14}},tooltip:{mode:'index',intersect:false}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,maxRotation:0,minRotation:0,color:'#647681'}},y:{grid:{color:'#edf0ea'},ticks:{color:'#647681'}}}};
 const draw = (id,sets, suggested={}) => {const c=document.getElementById(id);if(c && typeof Chart!=='undefined')new Chart(c,{type:'line',data:{labels:data.dates,datasets:sets},options:{...options,scales:{...options.scales,y:{...options.scales.y,...suggested}}}});};
 draw('hrvChart',[{label:'Daily HRV · ms',data:data.hrv,borderColor:'#89bdb5',pointRadius:1.5,tension:.25},{label:'7-day average · ms',data:data.hrv_7d,borderColor:'#18786e',pointRadius:0,borderWidth:2.5,tension:.25}]);
 draw('restChart',[{label:'Daily resting HR · bpm',data:data.resting_hr,borderColor:'#e6ad9e',pointRadius:1.5,tension:.25},{label:'7-day average · bpm',data:data.resting_hr_7d,borderColor:'#d97761',pointRadius:0,borderWidth:2.5,tension:.25}]);
 if(data.sleep_rating?.length)draw('sleepRatingChart',[{label:'Daily sleep rating',data:data.sleep_rating,borderColor:'#426c93',pointRadius:1.5,tension:.25},{label:'7-day average',data:data.sleep_rating_7d,borderColor:'#18786e',pointRadius:0,borderWidth:2.5,tension:.25}],{min:0,max:100});
})();
</script>
