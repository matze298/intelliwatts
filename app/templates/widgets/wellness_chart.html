<!-- app/templates/widgets/wellness_chart.html -->
<div class="p-8 rounded-lg shadow bg-slate-500 bg-opacity-10 border border-slate-700 space-y-8">
    <section class="space-y-6">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
            <div>
                <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 italic uppercase">📈 Wellness Trends</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400">Daily HRV and resting heart rate with 7-day smoothing.</p>
            </div>
            <div class="flex flex-wrap gap-4">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                    <span class="text-xs font-bold text-slate-500 uppercase">HRV (ms)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500"></span>
                    <span class="text-xs font-bold text-slate-500 uppercase">Rest HR (bpm)</span>
                </div>
            </div>
        </div>

        <div class="relative w-full h-[400px] overflow-hidden">
            <canvas id="wellnessChart"></canvas>
        </div>
    </section>

    {% if widget.data.sleep_rating %}
    <section class="space-y-6 border-t border-slate-700 pt-6">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
            <div>
                <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 italic uppercase">😴 Sleep Rating</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400">Daily sleep score with the same rolling view used for the physiological chart.</p>
            </div>
            <div class="flex flex-wrap gap-4">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                    <span class="text-xs font-bold text-slate-500 uppercase">Sleep Rating (0-100)</span>
                </div>
            </div>
        </div>

        <div class="relative w-full h-[280px] overflow-hidden">
            <canvas id="sleepRatingChart"></canvas>
        </div>
    </section>
    {% endif %}
</div>

<script>
    (function() {
        const data = {{ widget.data | tojson }};
        const wellnessCtx = document.getElementById('wellnessChart').getContext('2d');

        new Chart(wellnessCtx, {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [
                    {
                        label: 'HRV (Daily)',
                        data: data.hrv,
                        borderColor: 'rgba(59, 130, 246, 0.3)',
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        pointRadius: 2,
                        yAxisID: 'yHRV',
                        tension: 0.3
                    },
                    {
                        label: 'HRV (7d Avg)',
                        data: data.hrv_7d,
                        borderColor: '#3b82f6',
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        pointRadius: 0,
                        yAxisID: 'yHRV',
                        tension: 0.3
                    },
                    {
                        label: 'Rest HR (Daily)',
                        data: data.resting_hr,
                        borderColor: 'rgba(244, 63, 94, 0.3)',
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        pointRadius: 2,
                        yAxisID: 'yHR',
                        tension: 0.3
                    },
                    {
                        label: 'Rest HR (7d Avg)',
                        data: data.resting_hr_7d,
                        borderColor: '#f43f5e',
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        pointRadius: 0,
                        yAxisID: 'yHR',
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13 },
                        cornerRadius: 8,
                        boxPadding: 6
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: {
                            color: '#64748b',
                            maxRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    },
                    yHRV: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'HRV (ms)',
                            color: '#3b82f6',
                            font: { weight: 'bold' }
                        },
                        grid: { color: 'rgba(148, 163, 184, 0.1)' },
                        ticks: { color: '#64748b' }
                    },
                    yHR: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Rest HR (bpm)',
                            color: '#f43f5e',
                            font: { weight: 'bold' }
                        },
                        grid: { drawOnChartArea: false },
                        ticks: { color: '#64748b' }
                    }
                }
            }
        });

        const sleepCanvas = document.getElementById('sleepRatingChart');
        if (!sleepCanvas || !data.sleep_rating || data.sleep_rating.length === 0) {
            return;
        }

        const sleepCtx = sleepCanvas.getContext('2d');
        new Chart(sleepCtx, {
            type: 'line',
            data: {
                labels: data.dates,
                datasets: [
                    {
                        label: 'Sleep Rating (Daily)',
                        data: data.sleep_rating,
                        borderColor: 'rgba(16, 185, 129, 0.3)',
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        pointRadius: 2,
                        tension: 0.3
                    },
                    {
                        label: 'Sleep Rating (7d Avg)',
                        data: data.sleep_rating_7d,
                        borderColor: '#10b981',
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 13 },
                        cornerRadius: 8,
                        boxPadding: 6
                    }
                },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: {
                            color: '#64748b',
                            maxRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    },
                    y: {
                        suggestedMin: 0,
                        suggestedMax: 100,
                        title: {
                            display: true,
                            text: 'Sleep Rating',
                            color: '#10b981',
                            font: { weight: 'bold' }
                        },
                        grid: { color: 'rgba(148, 163, 184, 0.1)' },
                        ticks: { color: '#64748b' }
                    }
                }
            }
        });
    })();
</script>
