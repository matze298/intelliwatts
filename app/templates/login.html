{% from "macros/app_nav.html" import app_nav %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>IntelliWatts Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/tailwind-light.css">
</head>

<body>
    <main class="container max-w-xl">
        {{ app_nav("login") }}

        <h1 class="text-left mt-0">Sign in</h1>
        <form action="/login" method="post">
            <label for="password">Master password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button class="control-button control-button-primary" type="submit">Sign in</button>
        </form>

        {% if error %}
        <p role="alert">{{ error }}</p>
        {% endif %}
    </main>
</body>

</html>
