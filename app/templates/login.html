{% from "macros/theme.html" import render_theme_switcher %}
<!DOCTYPE html>
<html lang="en">

<head>
    <title>IntelliWatts Sign In</title>
    <link rel="stylesheet" id="theme-stylesheet" href="/static/tailwind-pro.css">
</head>

<body>
    <main class="container">
        <nav class="nav">
            <span>IntelliWatts</span>
            {{ render_theme_switcher() }}
        </nav>

        <h1>🚴 Sign in</h1>
        <form action="/login" method="post">
            <label for="password">Master password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
            <button class="control-button control-button-primary" type="submit">Sign in</button>
        </form>

        {% if error %}
        <p role="alert">{{ error }}</p>
        {% endif %}
    </main>
</body>

</html>
