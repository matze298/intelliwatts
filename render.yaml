services:
  - type: web
    name: ai-training-planner
    runtime: python
    plan: free
    buildCommand: | 
      pip install --upgrade pip
      pip install uv
      uv sync --frozen
    startCommand: >
      uv run gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:10000
    healthCheckPath: /health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: INTERVALS_API_KEY
        sync: false
      - key: LANGUAGE_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
