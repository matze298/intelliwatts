name: Gatekeeper

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  githooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Run githooks
        run: uv run prek run --all-files --show-diff-on-failure
    
  unittests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: intelliwatts
          POSTGRES_PASSWORD: intelliwatts
          POSTGRES_DB: intelliwatts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelliwatts -d intelliwatts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --extra dev --extra test

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run unit tests
        run: uv run pytest tests/ --cov=app --cov-branch --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_SECRET }}
  
  css_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Check generated CSS is up to date
        run: git diff --exit-code -- app/static/tailwind-*.css

  gatekeeper:
    needs: [githooks, unittests, css_build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check status
        if: needs.githooks.result != 'success' || needs.unittests.result != 'success' || needs.css_build.result != 'success'
        run: exit 1
