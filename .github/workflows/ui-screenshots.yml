name: Capture IntelliWatts UI screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  screenshots:
    # Never grant a write-capable checkout to an untrusted fork.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/intelliwatts-ui-refresh'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: intelliwatts
          POSTGRES_PASSWORD: intelliwatts
          POSTGRES_DB: intelliwatts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelliwatts -d intelliwatts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install test dependencies
        run: uv sync --extra dev --extra test

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Rebuild generated Tailwind assets
        run: |
          npm ci
          npm run build:css

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Capture real UI and check mobile overflow
        run: |
          if [ ! -f docs/screenshots/ui-planner-desktop.png ] ||
             [ ! -f docs/screenshots/ui-planner-mobile.png ] ||
             [ ! -f docs/screenshots/ui-dashboard-desktop.png ] ||
             [ ! -f docs/screenshots/ui-dashboard-mobile.png ]; then
            INTELLIWATTS_CAPTURE_SCREENSHOTS=1 uv run pytest tests/routes/test_browser_pages.py::test_capture_ui_reference_screenshots -q
          else
            echo "Screenshots already committed. Remove them to request a refresh."
          fi

      - name: Upload screenshots as build artifact
        uses: actions/upload-artifact@v6
        with:
          name: intelliwatts-playwright-screenshots
          path: docs/screenshots/ui-*.png
          if-no-files-found: error

      - name: Commit screenshot results to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ui-*.png app/static/tailwind-light.css
          if ! git diff --cached --quiet; then
            git commit -m "docs: add real Playwright UI screenshots and rebuilt CSS"
            for attempt in 1 2 3; do
              git fetch origin "${{ github.head_ref }}"
              if git ls-tree -r --name-only "origin/${{ github.head_ref }}" |
                 grep -q '^docs/screenshots/ui-dashboard-desktop.png          fi
; then
                echo "Another job already committed the screenshots."
                exit 0
              fi
              git rebase "origin/${{ github.head_ref }}"
              if git push origin HEAD:${{ github.head_ref }}; then
                exit 0
              fi
            done
            exit 1
          fi
